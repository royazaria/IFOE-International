<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You – IFOE Philippine Eagles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    :root{--gold:#F5B800;--gold-light:#FFD84D;--gold-dark:#C48A00;--black:#0A0A0A;--dark:#161616;--white:#FFFFFF}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Lato',sans-serif;background:var(--black);color:var(--white);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;overflow:hidden}
    .particles{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
    .particle{position:absolute;background:var(--gold);border-radius:50%;animation:float linear infinite;opacity:0}
    @keyframes float{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:.5}90%{opacity:.1}100%{transform:translateY(-5vh) scale(1.5);opacity:0}}
    .card{position:relative;z-index:10;max-width:620px;width:100%}
    .eagle-wrap{width:120px;height:120px;margin:0 auto 32px;animation:pulse 3s ease-in-out infinite}
    @keyframes pulse{0%,100%{filter:drop-shadow(0 0 20px rgba(245,184,0,.4))}50%{filter:drop-shadow(0 0 50px rgba(245,184,0,.9))}}
    .eagle-wrap img{width:100%;height:100%;object-fit:contain}
    .eyebrow{font-family:'Cinzel',serif;font-size:10px;letter-spacing:5px;text-transform:uppercase;color:var(--gold);margin-bottom:16px;animation:fadeUp .8s .2s both}
    .title{font-family:'Cinzel Decorative',cursive;font-size:clamp(28px,5vw,52px);font-weight:900;color:var(--white);margin-bottom:8px;animation:fadeUp .8s .35s both}
    .title span{color:var(--gold)}
    .divider{display:flex;align-items:center;gap:16px;justify-content:center;margin:20px auto;animation:fadeIn .8s .5s both}
    .dl{flex:1;max-width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
    .sub{font-size:15px;line-height:1.8;color:rgba(255,255,255,.55);max-width:480px;margin:0 auto 36px;animation:fadeIn .8s .6s both}
    .sub strong{color:var(--white)}
    .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;animation:fadeUp .8s .75s both}
    .btn-gold{font-family:'Cinzel',serif;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;padding:14px 30px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--black);border:none;border-radius:2px;text-decoration:none;cursor:pointer;transition:all .3s;box-shadow:0 4px 24px rgba(245,184,0,.35)}
    .btn-gold:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(245,184,0,.55)}
    .btn-ghost{font-family:'Cinzel',serif;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;padding:14px 30px;background:transparent;color:var(--white);border:1px solid rgba(255,255,255,.25);border-radius:2px;text-decoration:none;transition:all .3s}
    .btn-ghost:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}
    .countdown{font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.3);margin-top:40px;animation:fadeIn 1s 1s both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  </style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="card">
  <div class="eagle-wrap">
    <img src="logo_IFOE.jpg" alt="IFOE Eagle" />
  </div>
  <p class="eyebrow">Message Received</p>
  <h1 class="title">Thank <span>You!</span></h1>
  <div class="divider"><div class="dl"></div><span style="color:var(--gold);font-size:18px">✦</span><div class="dl"></div></div>
  <p class="sub">We've received your details and will reach out to you on <strong>Messenger within 24 hours</strong> with everything you need to know. Welcome to the Eagle family!</p>
  <div class="btns">
    <a href="index.html" class="btn-gold">← Back to Home</a>
    <a href="https://www.facebook.com/messages/t/61577709546547" target="_blank" rel="noopener" class="btn-ghost">💬 Message Us Now</a>
  </div>
  <p class="countdown" id="redir">Redirecting to home in <span id="ct">10</span>s…</p>
</div>
<script>
  const pc=document.getElementById('particles');
  for(let i=0;i<40;i++){const p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDuration=(9+Math.random()*14)+'s';p.style.animationDelay=(Math.random()*14)+'s';const s=(1+Math.random()*2.2)+'px';p.style.width=p.style.height=s;pc.appendChild(p);}
  let t=10;const ct=document.getElementById('ct');
  const iv=setInterval(()=>{t--;ct.textContent=t;if(t<=0){clearInterval(iv);window.location.href='index.html';}},1000);
</script>
</body>
</html>
